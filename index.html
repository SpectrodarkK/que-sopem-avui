<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c2540">
<title>Què sopem avui?</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Què sopem?">
<style>
  :root{
    --nit:#1c2540; --nit2:#2a3558; --mantega:#f5d36a; --plat:#fbf7ee; --tinta:#1c2540; --suau:#b9c0d8;
    --serif: "Iowan Old Style", Georgia, "Times New Roman", serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--nit);color:var(--plat);font-family:var(--sans)}
  body{padding:env(safe-area-inset-top,0) 18px env(safe-area-inset-bottom,0);max-width:560px;margin:0 auto;display:flex;flex-direction:column;min-height:100vh}
  header{display:flex;justify-content:space-between;align-items:center;padding:18px 0 8px}
  h1{font-family:var(--serif);font-weight:700;font-size:1.5rem;margin:0}
  .linkbtn{background:none;border:1px solid var(--suau);color:var(--plat);border-radius:999px;padding:8px 14px;font-size:.9rem}
  main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px;padding:10px 0 26px}
  .buit{text-align:center;color:var(--suau);font-family:var(--serif);font-size:1.25rem;line-height:1.4;padding:0 10px}
  .recepta{background:var(--plat);color:var(--tinta);border-radius:22px;padding:22px 20px;box-shadow:0 14px 30px rgba(0,0,0,.28)}
  .recepta.nova{animation:entra .35s ease-out}
  @keyframes entra{from{transform:translateY(10px) rotate(-.6deg);opacity:.4}to{transform:none;opacity:1}}
  .recepta h2{font-family:var(--serif);font-size:1.7rem;line-height:1.15;margin:0 0 6px}
  .temps{font-size:.95rem;color:#5b6482;margin:0 0 14px}
  .recepta h3{font-size:1rem;margin:14px 0 6px}
  .recepta ul,.recepta ol{margin:0;padding-left:1.2em;line-height:1.5}
  .recepta li+li{margin-top:3px}
  .pròpia{display:inline-block;font-size:.8rem;background:var(--mantega);border-radius:999px;padding:2px 10px;margin-left:6px;vertical-align:middle}
  #boto{align-self:center;width:176px;height:176px;border-radius:50%;border:10px solid var(--plat);background:var(--mantega);color:var(--tinta);
        font-family:var(--serif);font-weight:700;font-size:1.35rem;line-height:1.15;box-shadow:inset 0 0 0 8px rgba(28,37,64,.12),0 10px 24px rgba(0,0,0,.35)}
  #boto:active{transform:scale(.96)}
  button{cursor:pointer;font:inherit}
  button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--mantega);outline-offset:2px}
  dialog{width:min(94vw,520px);max-height:92vh;border:none;border-radius:22px;padding:20px;background:var(--plat);color:var(--tinta)}
  dialog::backdrop{background:rgba(10,14,28,.7)}
  dialog h2{font-family:var(--serif);margin:0 0 12px}
  label{display:block;font-weight:600;margin:12px 0 4px}
  input,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid #c9cde0;border-radius:12px;background:#fff;color:var(--tinta)}
  textarea{min-height:92px;resize:vertical}
  small{color:#5b6482}
  .files{display:flex;gap:10px;margin-top:16px}
  .files button{flex:1;padding:12px;border-radius:12px;border:none;font-weight:700}
  .prim{background:var(--nit);color:var(--plat)} .sec{background:#e6e8f2;color:var(--tinta)}
  .meves{margin-top:18px;border-top:1px solid #d9dcea;padding-top:12px}
  .meves div{display:flex;justify-content:space-between;align-items:center;padding:6px 0}
  .meves button{background:none;border:none;color:#b0302a;font-weight:600}
  dialog{overflow:auto}
  .avis{display:block;text-align:center;color:var(--mantega);margin-top:-8px}
  .meves div span{flex:1}.meves button{margin-left:12px}.meves .ed{color:var(--nit)}
  #lk-err{color:#b0302a;min-height:1.2em;margin:8px 0 0}
</style>
</head>
<body>
<header>
  <h1>Què sopem avui?</h1>
  <button class="linkbtn" id="obre">Gestiona les receptes</button>
</header>

<main>
  <div id="sortida" class="buit">Prem el botó i et proposo un sopar fàcil.</div>
  <button id="boto">Què sopem?</button>
  
</main>

<dialog id="lock">
  <h2>Codi d’accés</h2>
  <p>Per gestionar les receptes cal el codi.</p>
  <input id="lk-codi" type="password" autocomplete="current-password" aria-label="Codi d’accés">
  <label style="font-weight:400"><input type="checkbox" id="lk-recorda" checked style="width:auto"> Recorda’m en aquest dispositiu</label>
  <p id="lk-err"></p>
  <div class="files"><button class="sec" id="lk-tanca">Cancel·la</button><button class="prim" id="lk-ok">Entra</button></div>
</dialog>

<dialog id="dlg">
  <h2 id="t-dlg">Afegeix una recepta</h2>
  <label for="f-nom">Nom del plat</label>
  <input id="f-nom" maxlength="60" autocomplete="off">
  <label for="f-temps">Temps (minuts)</label>
  <input id="f-temps" type="number" min="1" max="240" value="20" inputmode="numeric">
  <label for="f-ing">Ingredients</label>
  <textarea id="f-ing"></textarea>
  <small>Un ingredient per línia.</small>
  <label for="f-pas">Preparació</label>
  <textarea id="f-pas"></textarea>
  <small>Un pas per línia.</small>
  <div class="files">
    <button class="sec" id="tanca">Tanca</button>
    <button class="prim" id="desa">Desa la recepta</button>
  </div>
  <div class="files"><button class="sec" id="baixa">Descarrega còpia de seguretat</button></div>
  <small id="estat"></small>
  <div class="meves" id="meves"></div>
</dialog>

<script>
/* ===== CONFIGURACIÓ DE SUPABASE (Project Settings → API) ===== */
const SUPABASE_URL = "https://EL-TEU-PROJECTE.supabase.co";
const SUPABASE_KEY = "LA-TEVA-CLAU-PUBLICA";   // anon / publishable (és pública per disseny)
/* RECEPTES INICIALS: només es fan servir si la base de dades encara és buida.
   Un cop desades a Supabase, les receptes es gestionen des de l’app. */
const SEED = [
  { nom:"Truita de patates ràpida", temps:25,
    ingredients:["3 patates","4 ous","1/2 ceba (opcional)","Oli i sal"],
    passos:["Talla les patates a làmines fines i fregeix-les a foc mitjà amb la ceba.","Bat els ous amb sal i barreja-hi les patates escorregudes.","Cuina-la a la paella uns 3 minuts per banda."] },
  { nom:"Espaguetis amb all i oli", temps:15,
    ingredients:["200 g d’espaguetis","3 grans d’all","Oli d’oliva","Pebre vermell o bitxo","Julivert"],
    passos:["Bull la pasta en aigua amb sal.","Daura l’all laminat en oli a foc baix amb una mica de bitxo.","Barreja-hi la pasta escorreguda i el julivert."] },
  { nom:"Arròs saltat amb ou i verdures", temps:15,
    ingredients:["Arròs bullit d’ahir","2 ous","Pastanaga i pèsols","Salsa de soja"],
    passos:["Saltea les verdures tallades petites.","Afegeix l’arròs i la salsa de soja.","Fes-hi un forat, cuina-hi els ous remenats i barreja-ho tot."] },
  { nom:"Crema de carbassa", temps:30,
    ingredients:["500 g de carbassa","1 patata","1/2 ceba","Brou o aigua","Un raig de nata (opcional)"],
    passos:["Talla-ho tot a daus i bull-ho 20 minuts en brou.","Tritura-ho fins que quedi fina.","Serveix-la amb un raig d’oli i pa torrat."] },
  { nom:"Pollastre a la planxa amb amanida", temps:20,
    ingredients:["2 filets de pollastre","Enciam, tomàquet i dacsa","Oli, sal i llimona"],
    passos:["Salpebra el pollastre i marca’l a la planxa 4-5 minuts per banda.","Amaneix l’amanida amb oli i llimona.","Talla el pollastre a tires i serveix-ho sobre l’amanida."] },
  { nom:"Pizza ràpida de pa de motlle", temps:15,
    ingredients:["Llesques de pa de motlle","Tomàquet triturat","Formatge ratllat","Pernil dolç o xampinyons"],
    passos:["Posa les llesques en una safata amb paper de forn.","Unta-hi tomàquet, afegeix el formatge i el que tinguis a la nevera.","Forn a 200 °C durant 8-10 minuts."] },
  { nom:"Cigrons saltats amb espinacs", temps:15,
    ingredients:["1 pot de cigrons cuits","Espinacs frescos","2 grans d’all","Pebre vermell"],
    passos:["Daura l’all en oli i afegeix el pebre vermell.","Incorpora els cigrons escorreguts i saltea’ls 5 minuts.","Afegeix els espinacs i cuina fins que s’arrugui."] },
  { nom:"Sandvitx calent de pernil i formatge", temps:10,
    ingredients:["2 llesques de pa de motlle","Pernil dolç","Formatge en llesques","Mantega"],
    passos:["Munta el sandvitx amb el pernil i el formatge.","Unta de mantega l’exterior.","Daura’l a la paella amb pes a sobre fins que el formatge es fongui."] },
  { nom:"Wraps de pollastre i verdura", temps:20,
    ingredients:["Tortitxes de blat","Pollastre cuit o a tires","Enciam i tomàquet","Iogurt o maionesa"],
    passos:["Saltea el pollastre a tires amb espècies.","Escalfa les tortitxes un moment.","Farceix-les amb el pollastre, la verdura i la salsa, i enrotlla."] },
  { nom:"Macarrons gratinats", temps:25,
    ingredients:["200 g de macarrons","Tomàquet fregit","Formatge ratllat","Carn picada (opcional)"],
    passos:["Bull els macarrons.","Barreja’ls amb el tomàquet (i la carn saltada).","Cobreix amb formatge i gratina 5-8 minuts al forn."] },
  { nom:"Salmó al forn amb patates", temps:30,
    ingredients:["2 talls de salmó","2 patates","Oli, sal i llimona","Herbes seques"],
    passos:["Talla les patates fines i enforna-les 10 minuts a 200 °C.","Afegeix-hi el salmó amb sal, oli i herbes.","Forneja 12-15 minuts més i serveix amb llimona."] },
  { nom:"Truita francesa amb formatge i amanida", temps:10,
    ingredients:["3 ous","Formatge (el que tinguis)","Mantega","Amanida"],
    passos:["Bat els ous amb una mica de sal.","Cuina’ls a la paella amb mantega a foc mitjà.","Posa-hi el formatge, plega-la i serveix-la amb l’amanida."] },
  { nom:"Samfaina amb ou ferrat", temps:30,
    ingredients:["1 albergínia","1 carbassó","1 pebrot","1 ceba","Tomàquet triturat","2 ous"],
    passos:["Sofregeix la ceba i el pebrot tallats.","Afegeix l’albergínia, el carbassó i el tomàquet; cou-ho 20 minuts.","Serveix-ho amb un ou ferrat a sobre."] },
  { nom:"Pasta freda amb tomàquet i mozzarella", temps:15,
    ingredients:["200 g de pasta","Tomàquets cherry","Mozzarella","Alfàbrega","Oli i sal"],
    passos:["Bull la pasta i refreda-la amb aigua.","Talla els tomàquets i la mozzarella.","Barreja-ho tot amb oli, sal i alfàbrega."] },
  { nom:"Hamburgueses casolanes", temps:20,
    ingredients:["400 g de carn picada","1 ou","Pa ratllat","Pa d’hamburguesa","Enciam, tomàquet i formatge"],
    passos:["Barreja la carn amb l’ou, el pa ratllat i sal; forma les hamburgueses.","Cuina-les 4 minuts per banda a la planxa.","Munta-les al pa amb la verdura i el formatge."] },
  { nom:"Sopa de pasta i verdures", temps:25,
    ingredients:["Brou","Pastanaga i api","Fideus o pasta petita","Un tros de pernil o pollastre (opcional)"],
    passos:["Bull les verdures a daus petits en el brou 10 minuts.","Afegeix la pasta i cou-la segons el paquet.","Rectifica de sal i serveix ben calent."] },
  { nom:"Quesadilles de formatge i pernil", temps:15,
    ingredients:["Tortitxes de blat","Formatge ratllat","Pernil dolç","Pebrot o ceba (opcional)"],
    passos:["Posa formatge i pernil sobre mitja tortitxa i plega-la.","Daura-la a la paella 2 minuts per banda.","Talla-la en triangles i serveix-la amb salsa."] },
  { nom:"Llenties estofades exprés", temps:25,
    ingredients:["1 pot de llenties cuites","1 pastanaga","1/2 ceba","1 all","Pebre vermell"],
    passos:["Sofregeix la ceba, la pastanaga i l’all.","Afegeix el pebre vermell, les llenties i un got d’aigua.","Cou-ho 10 minuts fins que espesseixi."] },
  { nom:"Amanida completa de tonyina i ou dur", temps:15,
    ingredients:["Enciam o mescla de brots","1 llauna de tonyina","2 ous durs","Tomàquet, olives i ceba tendra"],
    passos:["Bull els ous 10 minuts i pela’ls.","Talla la verdura i col·loca-la en un bol.","Afegeix-hi la tonyina, els ous i amaneix amb oli i vinagre."] },
  { nom:"Torrades amb alvocat i ou", temps:10,
    ingredients:["2 llesques de pa","1 alvocat","2 ous","Sal, pebre i llimona"],
    passos:["Torra el pa.","Esclafa l’alvocat amb sal, pebre i unes gotes de llimona.","Unta-ho al pa i corona amb un ou ferrat o escalfat."] }
];

const CLAU_CODI = "que-sopem-codi", CLAU_CACHE = "que-sopem-cache";
const $ = id => document.getElementById(id);
const CONFIGURAT = !SUPABASE_URL.includes("EL-TEU-PROJECTE");
const H = { apikey: SUPABASE_KEY, "Content-Type": "application/json" };
let receptes = [], codi = "", edita = -1, baralla = [], darrera = null;

/* --- Comunicació amb Supabase (sense llibreries) --- */
async function rpc(nom, cos){
  const r = await fetch(SUPABASE_URL + "/rest/v1/rpc/" + nom, { method:"POST", headers:H, body:JSON.stringify(cos) });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
const comprova = async c => { try { return (await rpc("comprova_codi", { p_codi:c })) === true; } catch(e) { return false; } };
const ls = { get:k => { try { return localStorage.getItem(k); } catch(e) { return null; } },
             set:(k,v) => { try { localStorage.setItem(k, v); } catch(e) {} },
             del:k => { try { localStorage.removeItem(k); } catch(e) {} } };

async function carrega(){
  if (CONFIGURAT) {
    try {
      const r = await fetch(SUPABASE_URL + "/rest/v1/receptari?id=eq.1&select=dades", { headers:H, cache:"no-store" });
      const d = await r.json();
      if (r.ok && d.length && Array.isArray(d[0].dades) && d[0].dades.length) {
        receptes = d[0].dades; ls.set(CLAU_CACHE, JSON.stringify(receptes)); return;
      }
      if (r.ok) { receptes = JSON.parse(JSON.stringify(SEED)); return; }   // base de dades buida
    } catch(e) {}
    try { const c = JSON.parse(ls.get(CLAU_CACHE)); if (Array.isArray(c) && c.length) { receptes = c; return; } } catch(e) {}
  }
  receptes = JSON.parse(JSON.stringify(SEED));
}

/* --- Proposta de sopar --- */
function barreja(){
  baralla = receptes.slice();
  for (let i = baralla.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [baralla[i], baralla[j]] = [baralla[j], baralla[i]];
  }
  if (darrera && baralla.length > 1 && baralla[baralla.length-1].nom === darrera.nom) baralla.unshift(baralla.pop());
}
function crea(tag, text, cls){
  const e = document.createElement(tag);
  if (text) e.textContent = text;
  if (cls) e.className = cls;
  return e;
}
function mostra(r){
  const s = $("sortida"); s.className = ""; s.textContent = "";
  const c = crea("article", null, "recepta nova");
  c.appendChild(crea("h2", r.nom));
  c.appendChild(crea("p", "⏱ " + r.temps + " minuts", "temps"));
  c.appendChild(crea("h3", "Ingredients"));
  const ul = crea("ul"); r.ingredients.forEach(i => ul.appendChild(crea("li", i))); c.appendChild(ul);
  c.appendChild(crea("h3", "Preparació"));
  const ol = crea("ol"); r.passos.forEach(p => ol.appendChild(crea("li", p))); c.appendChild(ol);
  s.appendChild(c);
  $("boto").textContent = "Una altra proposta";
}
$("boto").onclick = () => {
  if (!receptes.length) return;
  if (!baralla.length) barreja();
  darrera = baralla.pop();
  mostra(darrera);
};
carrega().then(barreja);

/* --- Accés amb codi (es comprova al servidor) --- */
const lk = $("lock"), dlg = $("dlg");
async function entra(){
  const c = $("lk-codi").value;
  $("lk-err").textContent = "Comprovant…";
  if (!(await comprova(c))) { $("lk-err").textContent = "Codi incorrecte o sense connexió."; return; }
  codi = c; $("lk-codi").value = ""; $("lk-err").textContent = "";
  $("lk-recorda").checked ? ls.set(CLAU_CODI, c) : ls.del(CLAU_CODI);
  lk.close(); obreGestio();
}
$("lk-ok").onclick = entra;
$("lk-tanca").onclick = () => lk.close();
$("lk-codi").addEventListener("keydown", e => { if (e.key === "Enter") entra(); });
$("obre").onclick = async () => {
  if (!CONFIGURAT) { alert("Falta configurar Supabase: omple SUPABASE_URL i SUPABASE_KEY al principi del codi."); return; }
  if (!codi) { const g = ls.get(CLAU_CODI); if (g && await comprova(g)) codi = g; else ls.del(CLAU_CODI); }
  if (!codi) { $("lk-err").textContent = ""; lk.showModal(); $("lk-codi").focus(); return; }
  obreGestio();
};

/* --- Gestió de receptes: cada canvi es desa directament --- */
const linies = t => t.split("\n").map(x => x.trim()).filter(Boolean);
function estat(t){ $("estat").textContent = t; }
async function desaTot(){
  estat("Desant…");
  try {
    if ((await rpc("desa_receptari", { p_codi:codi, p_dades:receptes })) !== true) { codi = ""; ls.del(CLAU_CODI); throw new Error("codi"); }
    ls.set(CLAU_CACHE, JSON.stringify(receptes)); estat("Desat ✓");
  } catch(e) { estat("No s’ha pogut desar (connexió o codi). Torna-ho a provar."); }
}
function canvia(){ barreja(); desaTot(); }
function neteja(){
  ["f-nom","f-ing","f-pas"].forEach(id => $(id).value = "");
  $("f-temps").value = 20; edita = -1; $("t-dlg").textContent = "Afegeix una recepta";
}
function pintaLlista(){
  const z = $("meves"); z.textContent = "";
  z.appendChild(crea("strong", "Receptes (" + receptes.length + ")"));
  receptes.forEach((r, i) => {
    const d = crea("div"); d.appendChild(crea("span", r.nom));
    const e = crea("button", "Edita", "ed");
    e.onclick = () => {
      edita = i; $("f-nom").value = r.nom; $("f-temps").value = r.temps;
      $("f-ing").value = r.ingredients.join("\n"); $("f-pas").value = r.passos.join("\n");
      $("t-dlg").textContent = "Edita la recepta"; dlg.scrollTo(0, 0);
    };
    const b = crea("button", "Esborra");
    b.onclick = () => {
      if (!confirm("Vols esborrar «" + r.nom + "»?")) return;
      receptes.splice(i, 1); neteja(); pintaLlista(); canvia();
    };
    d.append(e, b); z.appendChild(d);
  });
}
function obreGestio(){ estat(""); pintaLlista(); dlg.showModal(); }
$("tanca").onclick = () => { neteja(); dlg.close(); };
$("desa").onclick = () => {
  const nom = $("f-nom").value.trim(), ing = linies($("f-ing").value), pas = linies($("f-pas").value);
  if (!nom || !ing.length || !pas.length) { alert("Omple el nom, els ingredients i la preparació."); return; }
  const r = { nom, temps: parseInt($("f-temps").value, 10) || 20, ingredients: ing, passos: pas };
  if (edita >= 0) receptes[edita] = r; else receptes.push(r);
  neteja(); pintaLlista(); canvia();
};
$("baixa").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(receptes, null, 2)], {type:"application/json"}));
  a.download = "receptes-copia.json"; a.click();
};
</script>
</body>
</html>
